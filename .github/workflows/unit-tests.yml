name: Unit tests

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Caches ~/.gradle (wrapper, dependencies, and the JDK 25 daemon toolchain that
      # gradle/gradle-daemon-jvm.properties provisions via Foojay on first run).
      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
