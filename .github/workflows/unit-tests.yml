name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three independent jobs so a PR shows each check separately - the same Automated items as the
# ticket checklist (.claude/rules/test-execution.md).
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Caches ~/.gradle (wrapper, dependencies, and the JDK 25 daemon toolchain that
      # gradle/gradle-daemon-jvm.properties provisions via Foojay on first run).
      - uses: gradle/actions/setup-gradle@v6

      - uses: ./.github/actions/placeholder-google-services

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6
      - uses: ./.github/actions/placeholder-google-services

      # Android Lint + ktlint (ktlintCheck against config/ktlint/baseline.xml).
      - name: Run lint
        run: ./gradlew lint

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6
      - uses: ./.github/actions/placeholder-google-services

      - name: Build debug APK
        run: ./gradlew assembleDebug
